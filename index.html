    <!--
      Apply the saved theme before first paint. Without this the page renders
      in the default theme for a frame and then flips, which is the flash
      everyone notices on a themed site.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('usaim-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
          /* No saved choice: leave the attribute off so the CSS follows the
             operating system via prefers-color-scheme. */
        } catch (e) {
          /* storage blocked — system preference still applies */
        }
      })();
    </script>
